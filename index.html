<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Học Python Tự Lập - Hệ Thống Nhện Săn Lỗi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #161822; color: #a6accd; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        
        header { height: 50px; background-color: #1f2335; border-bottom: 1px solid #292e42; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 15px; font-weight: bold; color: #ff9e64; }
        .logo span { color: #7aa2f7; }
        #run-btn { height: 32px; padding: 0 15px; background-color: #41a1f4; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #run-btn:hover { background-color: #268bd2; }

        main { flex: 1; display: flex; overflow: hidden; }
        
        /* Khu vực nhập code tự chế không phụ thuộc thư viện ngoài */
        .editor-zone { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #1a1b26; border-right: 1px solid #292e42; }
        .editor-header { height: 35px; background-color: #1f2335; display: flex; align-items: center; px: 15px; padding: 0 15px; font-size: 12px; color: #565f89; border-bottom: 1px solid #292e42; }
        .code-container { flex: 1; display: flex; position: relative; overflow: auto; }
        .line-numbers { width: 45px; background-color: #1a1b26; border-right: 1px solid #292e42; text-align: right; padding-right: 10px; padding-top: 15px; color: #414868; user-select: none; line-height: 24px; font-size: 14px; }
        #code-input { flex: 1; background: transparent; border: none; outline: none; color: #c0caf5; padding-left: 15px; padding-top: 15px; resize: none; font-size: 14px; line-height: 24px; font-family: monospace; overflow-y: hidden; white-space: pre; }

        /* ĐỒ HỌA CHÚ NHỆN CƠ KHÍ */
        #spider-agent {
            position: absolute; right: 40px; top: -150px; width: 50px; height: 50px;
            z-index: 999; pointer-events: none; transition: top 0.4s ease-out;
            display: flex; align-items: center; justify-content: center;
        }
        #spider-agent::before {
            content: ''; position: absolute; bottom: 35px; left: 50%; width: 1px; height: 1000px; background: rgba(255,255,255,0.15);
        }
        .spider-body {
            width: 20px; height: 26px; background: #ff5555; border-radius: 50%; position: relative;
            border: 2px solid #ff79c6; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }
        .spider-body::after {
            content: ''; position: absolute; bottom: 5px; left: 3px; width: 3px; height: 3px; background: #00ffff; border-radius: 50%;
            box-shadow: 8px 0 #00ffff;
        }
        .spider-leg { position: absolute; width: 20px; height: 2px; background: #ff79c6; top: 50%; transform-origin: left center; transition: 0.3s; }
        .l1 { left: -18px; transform: rotate(35deg); }
        .l2 { left: -18px; transform: rotate(0deg); }
        .l3 { left: -18px; transform: rotate(-35deg); }
        .r1 { right: -20px; transform: scaleX(-1) rotate(35deg); }
        .r2 { right: -20px; transform: scaleX(-1) rotate(0deg); }
        .r3 { right: -20px; transform: scaleX(-1) rotate(-35deg); }
        
        /* Hiệu ứng duỗi chân dài ra chỉ điểm dòng lỗi */
        #spider-agent.active .l2 { width: 65px; transform: rotate(10deg); background: #ff5555; box-shadow: 0 0 5px #ff5555; }

        /* BONG BÓNG GIAO TIẾP TỰ CHẾ */
        .spider-bubble {
            position: absolute; right: 70px; top: -15px; width: 240px; background: #ff5555;
            color: #fff; padding: 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
            line-height: 1.4; box-shadow: 0 4px 10px rgba(0,0,0,0.5); opacity: 0;
            transform: scale(0.8); transition: 0.3s; pointer-events: none;
        }
        .spider-bubble::after {
            content: ''; position: absolute; right: -5px; top: 22px; border-width: 5px 0 5px 5px;
            border-style: solid; border-color: transparent transparent transparent #ff5555;
        }
        #spider-agent.active .spider-bubble { opacity: 1; transform: scale(1); }

        /* Khu vực Console */
        .console-zone { width: 320px; background-color: #13141f; border-left: 1px solid #292e42; display: flex; flex-direction: column; }
        .console-header { height: 35px; background-color: #1f2335; border-b: 1px solid #292e42; display: flex; align-items: center; padding: 0 15px; font-size: 11px; color: #565f89; text-transform: uppercase; font-weight: bold; }
        .console-body { flex: 1; padding: 15px; overflow: auto; color: #73daca; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐍 PYTHON <span>STANDALONE</span></div>
        <button id="run-btn">Chạy Lệnh</button>
    </header>

    <main>
        <!-- Editor Khu Vực Viết Mã Nguồn -->
        <section class="editor-zone">
            <div class="editor-header">MAIN.PY (Bộ Phân Tích Cú Pháp Độc Lập)</div>
            <div class="code-container">
                <div class="line-numbers" id="line-box">1</div>
                <textarea id="code-input" spellcheck="false" placeholder="# Nhập mã nguồn Python tại đây..."></textarea>
            </div>

            <!-- Mô hình nhện định vị -->
            <div id="spider-agent">
                <div class="spider-bubble" id="spider-talk"></div>
                <div class="spider-leg l1"></div>
                <div class="spider-leg l2"></div>
                <div class="spider-leg l3"></div>
                <div class="spider-leg r1"></div>
                <div class="spider-leg r2"></div>
                <div class="spider-leg r3"></div>
                <div class="spider-body"></div>
            </div>
        </section>
        <!-- Cột hiển thị bảng log Console -->
        <section class="console-zone">
            <div class="console-header">Kết Quả Hệ Thống (Console)</div>
            <div class="console-body" id="console-log">Sẵn sàng nhận lệnh. Hệ thống hoạt động 100% Offline độc lập.</div>
        </section>
    </main>

    <script>
        const codeInput = document.getElementById("code-input");
        const lineBox = document.getElementById("line-box");
        const consoleLog = document.getElementById("console-log");
        const spiderAgent = document.getElementById("spider-agent");
        const spiderTalk = document.getElementById("spider-talk");

        // Cập nhật số dòng tự động khi người dùng gõ
        function updateLineNumbers() {
            const lines = codeInput.value.split("\n");
            let numHtml = "";
            for (let i = 1; i <= lines.length; i++) {
                numHtml += i + "<br>";
            }
            lineBox.innerHTML = numHtml;
        }

        // TỰ ĐỊNH NGHĨA QUY TẮC PHÂN TÍCH CÚ PHÁP PYTHON KHÔNG CẦN LIÊN KẾT NGOÀI
        function selfCompilePython(code) {
            const lines = code.split("\n");
            let openBrackets = 0;
            let openQuotes = null;
            let blockIndentLevel = 0;

            for (let i = 0; i < lines.length; i++) {
                let currentLine = lines[i];
                let trimmed = currentLine.trim();
                let lineNum = i + 1;

                if (trimmed === "" || trimmed.startsWith("#")) continue;

                // Quy tắc 1: Kiểm tra cấu trúc đóng mở ngoặc đơn ()
                for (let char of currentLine) {
                    if (char === "(") openBrackets++;
                    if (char === ")") openBrackets--;
                }
                if (openBrackets < 0) {
                    return { line: lineNum, msg: "⚠️ Cú pháp lỗi: Thừa dấu đóng ngoặc đơn ')' mà không có mở ngoặc trước đó!" };
                }

                // Quy tắc 2: Kiểm tra cấu trúc đóng mở chuỗi ký tự '' hoặc ""
                for (let char of currentLine) {
                    if (char === '"' || char === "'") {
                        if (openQuotes === char) openQuotes = null;
                        else if (!openQuotes) openQuotes = char;
                    }
                }
                if (openQuotes) {
                    return { line: lineNum, msg: "⚠️ Cú pháp lỗi: Chuỗi văn bản bị hở! Thiếu dấu nháy kết thúc dòng văn bản." };
                }

                // Quy tắc 3: Kiểm tra cấu trúc rẽ nhánh bắt buộc có dấu hai chấm ':'
                if (trimmed.startsWith("if ") || trimmed.startsWith("elif ") || trimmed.startsWith("else") || trimmed.startsWith("for ") || trimmed.startsWith("while ") || trimmed.startsWith("def ")) {
                    if (!trimmed.endsWith(":")) {
                        return { line: lineNum, msg: "⚠️ Quy tắc cấu trúc: Thiếu dấu hai chấm ':' ở cuối câu lệnh điều kiện/vòng lặp." };
                    }
                }

                // Quy tắc 4: Kiểm tra logic thụt lề (Indentation Rules) sau khối lệnh chứa dấu ':'
                let spacesCount = currentLine.search(/\S/);
                if (blockIndentLevel > 0 && spacesCount < blockIndentLevel && trimmed !== "") {
                    // Nếu dòng trước yêu cầu thụt lề mà dòng này không thụt lề
                    if (spacesCount === 0) {
                        return { line: lineNum, msg: "⚠️ Lỗi Thụt Lề (Indentation): Câu lệnh này bắt buộc phải lùi vào (ấn Tab hoặc 4 dấu cách)!" };
                    }
                }

                // Cập nhật mức độ thụt lề mong đợi cho dòng tiếp theo
                if (trimmed.endsWith(":")) {
                    blockIndentLevel = (spacesCount === -1 ? 0 : spacesCount) + 4;
                } else if (trimmed !== "") {
                    blockIndentLevel = spacesCount;
                }
            }

            if (openBrackets > 0) {
                return { line: lines.length, msg: "⚠️ Cú pháp lỗi: Quên chưa đóng ngoặc đơn ')' ở cuối chương trình!" };
            }

            return null; // Không có lỗi
        }

        // ĐIỀU KHIỂN ĐỊNH VỊ TỌA ĐỘ VÀ GIAO TIẾP CHO NHỆN
        function runSyntaxCheck() {
            const code = codeInput.value;
            const error = selfCompilePython(code);

            if (!error) {
                // Code chuẩn quy tắc: Nhện bò lên ẩn đi
                spiderAgent.classList.remove("active");
                spiderAgent.style.top = "-150px";
                return;
            }

            // Tính toán khoảng cách tọa độ hiển thị từng dòng (mỗi dòng cao 24px + 15px padding đầu)
            const rowHeight = 24;
            const paddingTop = 50; // Khớp với Header và Panel Header bên ngoài
            const spiderTargetTop = ((error.line - 1) * rowHeight) + paddingTop;

            // Kích hoạt nhện di chuyển và mở bong bóng thoại chỉ điểm
            spiderTalk.innerText = `Dòng ${error.line}:\n\n` + error.msg;
            spiderAgent.style.top = spiderTargetTop + "px";
            
            setTimeout(() => {
                spiderAgent.classList.add("active");
            }, 50);
        }

        // Xử lý nút Chạy lệnh giả lập cơ bản
        document.getElementById("run-btn").onclick = () => {
            const code = codeInput.value;
            const error = selfCompilePython(code);

            if (error) {
                consoleLog.innerHTML = `<span style="color: #f7768e;">[LỖI CÚ PHÁP KHÔNG THỂ CHẠY]:<br>Hãy sửa lại theo hướng dẫn của Nhện ở dòng ${error.line}.</span>`;
                return;
            }

            // Giả lập xử lý hàm xuất dữ liệu print cơ bản trong JS thuần
            if (code.includes("print(")) {
                let matches = code.match(/print\((['"])(.*?)\1\)/g);
                if (matches) {
                    let results = matches.map(m => m.replace(/print\((['"])/, "").replace(/(['"])\)/, ""));
                    consoleLog.innerHTML = results.join("<br>");
                    return;
                }
            }
            consoleLog.innerHTML = "Chương trình thực thi thành công (Không có lệnh in dữ liệu ra ngoài).";
        };

        // Theo dõi sự kiện nhập phím của người dùng
        let timer;
        codeInput.addEventListener("input", () => {
            updateLineNumbers();
            clearTimeout(timer);
            // Quét lỗi sau khi dừng gõ 300ms
            timer = setTimeout(runSyntaxCheck, 300);
        });

        // Giữ đồng bộ cuộn màn hình giữa dòng số và khung gõ
        codeInput.addEventListener("scroll", () => {
            lineBox.scrollTop = codeInput.scrollTop;
        });

        // Kích hoạt khởi chạy mặc định ban đầu
        window.addEventListener("DOMContentLoaded", () => {
            updateLineNumbers();
        });
    </script>
</body>
</html>
