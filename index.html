<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Excel Bản Cải Tiến Hoàn Chỉnh</title>
    
    <!-- Tải tệp CSS tổng hợp duy nhất của Univer - Đảm bảo không lỗi hiển thị -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- Tải tệp JS lõi tổng hợp của Univer (Đầy đủ toàn bộ chức năng Excel) -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #excel-app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Khung chứa bảng tính Excel -->
    <div id="excel-app"></div>

    <script>
        // Sử dụng gói UMD tổng hợp để kích hoạt Excel tức thì không sợ xung đột file
        const univer = new UniverComponent.Univer({
            theme: UniverComponent.defaultTheme
        });

        // Kích hoạt toàn bộ các lõi tính năng cao cấp của Microsoft Excel
        univer.registerPlugin(UniverComponent.UniverRenderEnginePlugin);
        univer.registerPlugin(UniverComponent.UniverFormulaEnginePlugin);
        univer.registerPlugin(UniverComponent.UniverUiPlugin, {
            container: 'excel-app',
            header: true,   // Bật thanh Menu chính (File, Home, Insert)
            toolbar: true,  // Bật thanh công cụ (Đậm, Nghiêng, Cỡ chữ, Màu sắc)
            footer: true,   // Bật thanh quản lý nhiều Sheet và thanh thống kê số liệu
        });

        // Đăng ký kiến trúc bảng tính chuyên nghiệp
        univer.registerPlugin(UniverComponent.UniverDocsPlugin);
        univer.registerPlugin(UniverComponent.UniverSheetsPlugin);
        univer.registerPlugin(UniverComponent.UniverSheetsUiPlugin);
        univer.registerPlugin(UniverComponent.UniverSheetsFormulaPlugin);

        // Tạo lập bảng tính khởi tạo với cấu trúc dòng cột chuẩn
        univer.createUniverSheet({
            id: 'smart-workbook',
            name: 'Hệ thống Excel Agent',
            sheetOrder: ['sheet-main'],
            sheets: {
                'sheet-main': {
                    id: 'sheet-main',
                    name: 'Sheet1',
                    rowCount: 100,      // Khởi tạo sẵn 100 dòng kéo dài xuống
                    columnCount: 26,    // Khởi tạo sẵn từ cột A đến cột Z
                }
            }
        });
    </script>
</body>
</html>
