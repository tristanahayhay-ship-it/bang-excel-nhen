<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Spider Hunter - Web Crawler Edition</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0f141c; color: #e1e4e8; font-family: 'Fira Code', Consolas, Monaco, monospace; overflow: hidden; }
        #app-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        header { background: #161b22; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; z-index: 10; }
        h1 { margin: 0; font-size: 16px; font-weight: 600; color: #58a6ff; display: flex; align-items: center; gap: 8px; }
        #status { font-size: 13px; color: #8b949e; padding: 4px 8px; border-radius: 4px; background: #21262d; }
        .status-ok { color: #56d364 !important; }
        .status-error { color: #f85149 !important; }
        #workspace { flex: 1; position: relative; width: 100%; }
        #code-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; color: #e1e4e8; border: none; padding: 25px; font-family: inherit; font-size: 15px; line-height: 1.6; outline: none; resize: none; z-index: 1; caret-color: #58a6ff; white-space: pre; overflow: auto; }
        #spider-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    </style>
    <!-- Tích hợp thư viện Acorn Parser để bắt lỗi cú pháp JavaScript -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>🕷️ Bug Spider Hunter <span style="font-size: 11px; color:#8b949e; font-weight:normal;">(GitHub Pages MVP)</span></h1>
            <div id="status" class="status-ok">✔ Code hợp lệ. Nhện đang ngủ...</div>
        </header>
        <div id="workspace">
            <textarea id="code-input" spellcheck="false" placeholder="// Hãy dán hoặc viết code JavaScript vào đây.&#10;// Hãy thử cố tình viết sai cú pháp (ví dụ: thiếu dấu ngoặc, gõ sai từ khóa) để gọi nhện!&#10;&#10;function helloWorld() {&#10;    console.log('Xin chào!')&#10;}"></textarea>
            <canvas id="spider-canvas"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
