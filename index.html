<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Visual Crawler Network Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #0d0f1a; color: #7982a9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        
        header { height: 50px; background-color: #141726; border-bottom: 1px solid #1f2438; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 14px; font-weight: bold; color: #00f0ff; tracking-spacing: 1px; text-transform: uppercase; }
        .logo span { color: #ff007f; }
        #compile-btn { height: 32px; padding: 0 16px; background-color: #00f0ff; color: #0d0f1a; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #compile-btn:hover { background-color: #00bfff; box-shadow: 0 0 10px rgba(0,240,255,0.5); }

        main { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* Panel Nhập Mã Nguồn */
        .code-panel { flex: 1; display: flex; flex-direction: column; background-color: #0a0b14; border-right: 1px solid #1f2438; z-index: 2; min-width: 0; }
        .panel-title { height: 35px; background-color: #141726; display: flex; align-items: center; padding: 0 15px; font-size: 11px; color: #4e5579; border-bottom: 1px solid #1f2438; text-transform: uppercase; font-weight: bold; }
        .workspace { flex: 1; display: flex; position: relative; }
        .line-counter { width: 45px; background-color: #0a0b14; border-right: 1px solid #1f2438; text-align: right; padding-right: 12px; padding-top: 15px; color: #313652; user-select: none; line-height: 24px; font-size: 13px; }
        #editor-textarea { flex: 1; background: transparent; border: none; outline: none; color: #cdd6f4; padding-left: 15px; padding-top: 15px; resize: none; font-size: 13.5px; line-height: 24px; font-family: monospace; white-space: pre; overflow: auto; }

        /* KHÔNG GIAN ĐỒ HỌA MẠNG NHỆN CRAWLER (CANVAS NẰM LỚP DƯỚI) */
        .network-panel { width: 420px; background-color: #080911; display: flex; flex-direction: column; position: relative; }
        #network-canvas { flex: 1; width: 100%; background-color: #080911; cursor: crosshair; }

        /* CON NHỆN CRAWLER NEON TỰ CHẾ */
        #crawler-spider {
            position: absolute; width: 24px; height: 24px; z-index: 10;
            pointer-events: none; opacity: 0; transform: translate(-50%, -50%);
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .spider-node {
            width: 8px; height: 10px; background: #00f0ff; border-radius: 50%; position: absolute;
            top: 7px; left: 8px; box-shadow: 0 0 8px #00f0ff;
        }
        /* Tạo hiệu ứng chân nhện crawler tủa ra bằng CSS */
        .s-leg { position: absolute; width: 10px; height: 1.5px; background: #00f0ff; top: 12px; transform-origin: left center; }
        .sl1 { left: 2px; transform: rotate(45deg); }
        .sl2 { left: 2px; transform: rotate(180deg); }
        .sl3 { left: 2px; transform: rotate(-45deg); }
        .sr1 { right: 2px; transform: scaleX(-1) rotate(45deg); }
        .sr2 { right: 2px; transform: scaleX(-1) rotate(180deg); }
        .sr3 { right: 2px; transform: scaleX(-1) rotate(-45deg); }

        /* Hộp Thông Báo Trạng Thái Đọc Dữ Liệu */
        #crawler-bubble {
            position: absolute; background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff;
            color: #00f0ff; font-size: 11px; padding: 6px 10px; border-radius: 4px;
            pointer-events: none; opacity: 0; transform: translate(-50%, -130%);
            transition: left 0.5s ease, top 0.5s ease, opacity 0.3s;
            white-space: nowrap; font-weight: bold; box-shadow: 0 0 8px rgba(0,240,255,0.2);
            z-index: 11;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🕸️ Web Crawler <span>Network Lab</span></div>
        <button id="compile-btn">Phân Tích & Kết Nối</button>
    </header>

    <main>
        <!-- Khung Nhập Liệu Code Giả Lập -->
        <section class="code-panel">
            <div class="panel-title">main.py (Trình dịch phân tách thực thể)</div>
            <div class="workspace">
                <div class="line-counter" id="line-box">1</div>
                <textarea id="editor-textarea" spellcheck="false" placeholder="# Nhập code để crawler tạo sơ đồ..."></textarea>
            </div>
        </section>

        <!-- Khung Đồ Họa Sơ Đồ Mạng Lưới Nhện -->
        <section class="network-panel">
            <div class="panel-title">Mô phỏng mạng nhện thu thập dữ liệu (Index Graph)</div>
            
            <!-- Con nhện Crawler di chuyển động -->
            <div id="crawler-spider">
                <div class="spider-node"></div>
                <div class="s-leg sl1"></div>
                <div class="s-leg sl2"></div>
                <div class="s-leg sl3"></div>
                <div class="s-leg sr1"></div>
                <div class="s-leg sr2"></div>
                <div class="s-leg sr3"></div>
            </div>
            <!-- Bong bóng hội thoại hiển thị tiến trình quét thực thể -->
            <div id="crawler-bubble">Mapping...</div>

            <canvas id="network-canvas"></canvas>
        </section>
    </main>

    <script>
        const editorTextarea = document.getElementById("editor-textarea");
        const lineBox = document.getElementById("line-box");
        const canvas = document.getElementById("network-canvas");
        const ctx = canvas.getContext("2d");
        const spider = document.getElementById("crawler-spider");
        const bubble = document.getElementById("crawler-bubble");

        let nodes = [];
        let links = [];
        let spiderQueue = [];
        let isSpiderMoving = false;

        // Code mẫu chứa các từ khóa học và tài liệu để Nhện Crawler bò đi kết nối dữ liệu
        const demoCode = `# Hệ thống phân tích tài liệu và cấu trúc mạng nhện\\nimport sys\\n\\n# Đọc thông tin từ mã định danh bài báo khoa học\\nPMID_1999 = "1999Palgy.42.191"\\nDOI_Link = "doi:10.1111/1475-4983"\\n\\ndef scan_spider_evolution():\\n    print("Đang quét cấu trúc bài viết Selden P.A. 2011")\\n    citation_id = "PMID_21508021"\\n    \\n    if citation_id == "PMID_21508021":\\n        # Kết nối đến cụm dữ liệu Graph mạng lưới\\n        connect_node("Biology_Letters_7")\\n        connect_node("Araneae_Nephilidae")`;

        // Tự động căn chỉnh kích thước màn hình Canvas vẽ mạng lưới
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawNetwork();
        }

        // Cập nhật số dòng gõ văn bản
        function updateLineNumbers() {
            const lines = editorTextarea.value.split("\n");
            let numHtml = "";
            for (let i = 1; i <= lines.length; i++) { numHtml += i + "<br>"; }
            lineBox.innerHTML = numHtml;
        }

        // HÀM VẼ SƠ ĐỒ MẠNG LƯỚI (GRAPH NODES & FILAMENTS)
        function drawNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Vẽ các đường tơ nhện kết nối giữa các nút (Links)
            ctx.lineWidth = 1;
            links.forEach(link => {
                let fromNode = nodes.find(n => n.id === link.from);
                let toNode = nodes.find(n => n.id === link.to);
                if (fromNode && toNode) {
                    ctx.beginPath();
                    ctx.moveTo(fromNode.x, fromNode.y);
                    ctx.lineTo(toNode.x, toNode.y);
                    ctx.strokeStyle = link.active ? "rgba(0, 240, 255, 0.4)" : "rgba(78, 85, 121, 0.2)";
                    ctx.stroke();
                }
            });

            // 2. Vẽ các nút thắt dữ liệu phát sáng (Nodes)
            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.size, 0, Math.PI * 2);
                ctx.fillStyle = node.active ? "#ff007f" : "#242b4b";
                ctx.shadowBlur = node.active ? 10 : 0;
                ctx.shadowColor = "#ff007f";
                ctx.fill();
                ctx.shadowBlur = 0; // Reset hiệu ứng nhòe sáng

                // Vẽ vòng tròn viền ngoài cho Node hoạt động
                if (node.active) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.size + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // In nhãn text hiển thị tên thực thể dữ liệu cạnh nút
                ctx.fillStyle = node.active ? "#cdd6f4" : "#4e5579";
                ctx.font = "10px monospace";
                ctx.fillText(node.label, node.x + 12, node.y + 4);
            });
        }

        // THUẬT TOÁN ĐIỀU KHIỂN CON NHỆN DI CHUYỂN TỪNG BƯỚC THEO HÀNG ĐỢI (QUEUE CRAWL)
        function processSpiderQueue() {
            if (spiderQueue.length === 0) {
                isSpiderMoving = false;
                // Kết thúc tiến trình: Nhện mờ đi ẩn mình
                setTimeout(() => {
                    if (!isSpiderMoving) { spider.style.opacity = "0"; bubble.style.opacity = "0"; }
                }, 1000);
                return;
            }

            isSpiderMoving = true;
            let currentTarget = spiderQueue.shift();
            let targetNode = nodes.find(n => n.id === currentTarget.nodeId);

            if (targetNode) {
                // Hiển thị nhện và di chuyển tọa độ mượt mà đến nút thắt
                spider.style.opacity = "1";
                bubble.style.opacity = "1";
                spider.style.left = targetNode.x + "px";
                spider.style.top = targetNode.y + "px";

                bubble.style.left = targetNode.x + "px";
                bubble.style.top = targetNode.y + "px";
                bubble.innerText = `Crawl: ${currentTarget.type} -> ${targetNode.label}`;

                // Kích hoạt phát sáng nút thắt và sợi tơ liên kết khi nhện bò qua
                setTimeout(() => {
                    targetNode.active = true;
                    let incomingLink = links.find(l => l.to === targetNode.id);
                    if (incomingLink) incomingLink.active = true;
                    drawNetwork();

                    // Tiếp tục bò sang nút thắt dữ liệu tiếp theo trong hàng đợi
                    setTimeout(processSpiderQueue, 600);
                }, 500);
            } else {
                processSpiderQueue();
            }
        }

        // LOGIC PHÂN TÍCH TỪ KHÓA MÃ NGUỒN ĐỂ THIẾT LẬP GRAPH VÀ KÍCH HOẠT NHỆN
        function analyzeAndBuildGraph() {
            const codeText = editorTextarea.value;
            
            // Khởi tạo ngẫu nhiên vị trí các Node thắt dữ liệu trên không gian đồ họa
            nodes = [
                { id: "root", label: "MAIN.PY", x: 60, y: 80, size: 5, active: true },
                { id: "pmid", label: "PMID:1999Palgy", x: 220, y: 60, size: 4, active: false },
                { id: "doi", label: "DOI:10.1111", x: 340, y: 110, size: 4, active: false },
                { id: "citation", label: "PMC:3169061", x: 150, y: 180, size: 4, active: false },
                { id: "journal", label: "Biology_Letters_7", x: 280, y: 240, size: 4, active: false },
                { id: "family", label: "Araneae:Nephilidae", x: 120, y: 310, size: 4, active: false }
            ];

            // Thiết lập cấu trúc đường tơ liên kết (Edges) hình dáng mạng nhện hình học
            links = [
                { from: "root", to: "pmid", active: false },
                { from: "pmid", to: "doi", active: false },
                { from: "root", to: "citation", active: false },
                { from: "citation", to: "journal", active: false },
                { from: "citation", to: "family", active: false }
            ];

            // Đặt lại trạng thái mạng ban đầu và quét từ khóa để thêm việc cho nhện bò
            spiderQueue = [];
            drawNetwork();

            if (codeText.includes("1999Palgy")) {
                spiderQueue.push({ nodeId: "pmid", type: "STRING" });
            }
            if (codeText.includes("doi:")) {
                spiderQueue.push({ nodeId: "doi", type: "LINK" });
            }
            if (codeText.includes("PMID_21508021")) {
                spiderQueue.push({ nodeId: "citation", type: "IDENTIFIER" });
            }
            if (codeText.includes("Biology_Letters_7")) {
                spiderQueue.push({ nodeId: "journal", type: "NODE_CONNECT" });
            }
            if (codeText.includes("Araneae_Nephilidae")) {
                spiderQueue.push({ nodeId: "family", type: "STRUCT_DATA" });
            }

            // Nếu phát hiện có thực thể dữ liệu trong mã nguồn, ra lệnh cho nhện xuất kích bò đi dệt tơ
            if (spiderQueue.length > 0 && !isSpiderMoving) {
                // Đặt nhện xuất phát từ vị trí Nút Gốc (main.py)
                spider.style.opacity = "1";
                spider.style.left = nodes[0].x + "px";
                spider.style.top = nodes[0].y + "px";
                
                setTimeout(processSpiderQueue, 400);
            }
        }

        // Đăng ký các trình lắng nghe tương tác người dùng
        document.getElementById("compile-btn").onclick = analyzeAndBuildGraph;
        
        editorTextarea.addEventListener("input", () => {
            updateLineNumbers();
        });

        editorTextarea.addEventListener("scroll", () => {
            lineBox.scrollTop = editorTextarea.scrollTop;
        });

        window.addEventListener("resize", resizeCanvas);

        // Nạp mã nguồn mẫu ban đầu khi ứng dụng sẵn sàng
        window.addEventListener("DOMContentLoaded", () => {
            editorTextarea.value = demoCode;
            updateLineNumbers();
            setTimeout(resizeCanvas, 100);
        });
    </script>
</body>
</html>
