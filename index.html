<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Excel Bản Cải Tiến - Univer Sheet</title>
    
    <!-- Tải toàn bộ mã CSS cốt lõi và giao diện Sheet của Univer -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- Tải các lõi xử lý JavaScript (UMD) độc lập -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }
        /* Vùng chứa bảng tính Excel chiếm trọn vẹn không gian màn hình */
        #univer-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Khung chứa cấu trúc lưới Excel -->
    <div id="univer-container"></div>

    <script>
        // Kích hoạt lõi kiến trúc Univer ngay khi trang web sẵn sàng
        const univer = new UniverCore.Univer({
            theme: UniverDesign.defaultTheme,
        });

        // Đăng ký các mô-đun UI, thanh công cụ, lõi render đồ họa và trình biên dịch công thức
        univer.registerPlugin(UniverRenderEngine.UniverRenderEnginePlugin);
        univer.registerPlugin(UniverFormulaEngine.UniverFormulaEnginePlugin);
        univer.registerPlugin(UniverUi.UniverUiPlugin, {
            container: 'univer-container',
            header: true,    // Bật thanh Menu (File, Home, Insert...)
            toolbar: true,   // Bật thanh công cụ nhanh (Font, màu sắc, căn lề...)
            footer: true,    // Bật thanh quản lý Sheet (Sheet1, Sheet2...) và thanh trạng thái
        });

        univer.registerPlugin(UniverDocs.UniverDocsPlugin);
        univer.registerPlugin(UniverDocsUi.UniverDocsUiPlugin);
        univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
        univer.registerPlugin(UniverSheetsUi.UniverSheetsUiPlugin);
        univer.registerPlugin(UniverSheetsNumfmt.UniverSheetsNumfmtPlugin);
        univer.registerPlugin(UniverSheetsFormula.UniverSheetsFormulaPlugin);

        // Khởi tạo một Workbook trống có cấu trúc dòng cột y hệt Microsoft Excel
        univer.createUniverSheet({
            id: 'workbook-1',
            name: 'Bảng tính cải tiến',
            sheetOrder: ['sheet-1'],
            sheets: {
                'sheet-1': {
                    id: 'sheet-1',
                    name: 'Sheet1',
                    rowCount: 100,    // Khởi tạo sẵn 100 dòng
                    columnCount: 26,  // Khởi tạo sẵn 26 cột (A-Z)
                }
            }
        });
    </script>
</body>
</html>
