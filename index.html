<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Web 3D Mini Test</title>
    <!-- Nhúng file định dạng CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng thư viện đồ họa 3D Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Màn hình chờ khóa chuột khi mới vào game -->
    <div id="blocker">
        <div id="instructions">BẤM VÀO ĐÂY ĐỂ VÀO GAME (CF WEB)</div>
        <div id="sub-instructions">
            Di chuyển: WASD | Ngắm/Quay chuột: Di chuyển chuột<br>
            Bắn: Chuột trái | Bấm ESC để thoát chuột
        </div>
    </div>

    <!-- Hồng tâm ngắm bắn ở chính giữa màn hình -->
    <div id="crosshair"></div>

    <!-- Bảng hiển thị điểm số -->
    <div id="scoreboard">SCORE: <span id="score">0</span></div>

    <!-- Nơi chứa toàn bộ thế giới 3D -->
    <div id="canvas-container"></div>

    <!-- Nhúng file xử lý logic game JavaScript -->
    <script src="game.js"></script>
</body>
</html>
