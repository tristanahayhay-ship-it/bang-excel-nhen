<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Biên Dịch Python Trực Tuyến - Programiz Tiếng Việt</title>
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng thư viện lõi biên dịch Python ngay trên trình duyệt -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <header>
        <div class="logo"><span>🕷️</span> Python Online Compiler (Việt Hóa)</div>
        <button class="btn-run" onclick="runPython()">▶ CHẠY CODE (RUN)</button>
    </header>

    <div class="main-compiler">
        <!-- BÊN TRÁI: Giao diện soạn thảo mã nguồn -->
        <div class="editor-container">
            <div class="panel-bar">main.py</div>
            <textarea id="code" spellcheck="false"># Gõ thử code sai ở đây để xem nhện hoạt động nhé!
ten = "Lập trình viên"
print("Xin chào " + ten)

# CỐ TÌNH LỖI: Viết sai chính tả hàm print thành 'prnt'
prnt("Dòng này bị viết sai tên hàm rồi!")
</textarea>
            <!-- Phần tử ẩn làm gương đo đạc pixel tọa độ ký tự lỗi -->
            <div id="textarea-mirror"></div>
        </div>
        
        <!-- BÊN PHẢI: Khung hiển thị kết quả nguyên bản của Programiz -->
        <div class="output-container">
            <div class="panel-bar">KẾT QUẢ HỆ THỐNG (OUTPUT)</div>
            <pre id="output">Đang khởi động môi trường Python... Vui lòng đợi...</pre>
        </div>
    </div>

    <!-- Bong bóng thoại Tiếng Việt của con nhện kiểm lỗi -->
    <div id="spider-bubble"></div>
    
    <!-- Lớp vẽ đồ họa con nhện phủ toàn màn hình -->
    <canvas id="spider-layer"></canvas>

    <script src="script.js"></script>
</body>
</html>
