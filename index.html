<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Python Compiler (Interpreter)</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://jsdelivr.net"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- CodeMirror JS -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <!-- Pyodide Core Framework -->
    <script src="https://jsdelivr.net"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-pg-blue: #24293e;
            --color-pg-dark: #1e2235;
            --color-pg-btn: #3e445e;
            --color-pg-run: #2b5bf7;
            --color-pg-run-hover: #1e4bd6;
        }
        .CodeMirror { 
            height: 100%; 
            font-family: 'Fira Code', Menlo, Monaco, Consolas, monospace; 
            font-size: 15px; 
            background: #1e2235 !important;
        }
        .CodeMirror-gutter { background: #1e2235 !important; border-right: 1px solid #2d324d !important; }
        .CodeMirror-linenumbers { color: #5c6370 !important; }
    </style>
</head>
<body class="bg-pg-blue text-gray-200 flex flex-col h-screen overflow-hidden m-0 p-0 font-sans selection:bg-blue-600/30">

    <!-- Top Navigation Bar -->
    <header class="h-14 bg-pg-blue border-b border-[#2d324d] px-6 flex items-center justify-between z-10">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-black text-white tracking-wider">Programiz</span>
            <span class="text-xs bg-[#3a3f58] text-gray-300 px-1.5 py-0.5 rounded font-mono font-bold">PYTHON</span>
        </div>
        <div class="flex items-center space-x-3">
            <div id="status" class="text-xs font-mono text-yellow-400 mr-2 flex items-center gap-1.5">
                <span class="h-1.5 w-1.5 rounded-full bg-yellow-400 animate-pulse"></span>
                Loading Python...
            </div>
            <button id="run-btn" disabled class="h-9 px-5 bg-pg-run hover:bg-pg-run-hover disabled:bg-[#32364c] text-white font-semibold text-sm rounded shadow transition-all cursor-pointer disabled:cursor-not-allowed flex items-center justify-center space-x-1">
                <span>Run</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden bg-pg-dark">
        <!-- Left Panel: main.py Editor -->
        <section class="flex-1 flex flex-col min-w-0 border-b md:border-b-0 md:border-r border-[#2d324d]">
            <div class="h-10 bg-pg-blue flex items-center justify-between px-4 border-b border-[#2d324d]">
                <div class="flex items-center space-x-1 border-b-2 border-pg-run h-full px-2 mt-[2px]">
                    <span class="text-xs font-mono font-bold text-white tracking-wide">main.py</span>
                </div>
                <button id="clear-btn" class="text-xs text-gray-400 hover:text-white transition font-medium cursor-pointer">Clear</button>
            </div>
            <div class="flex-1 relative overflow-hidden">
                <textarea id="code-editor"></textarea>
            </div>
        </section>
        <!-- Right Panel: Output Console -->
        <section class="w-full md:w-1/2 flex flex-col min-w-0 bg-[#151824]">
            <div class="h-10 bg-[#1a1d29] flex items-center px-4 border-b border-[#2d324d]">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Output</span>
            </div>
            <div class="flex-1 p-5 font-mono text-sm leading-relaxed overflow-auto select-text">
                <pre id="output" class="text-[#a6accd] whitespace-pre-wrap">Preparing compiler workspace...</pre>
            </div>
        </section>
    </main>

    <script>
        let pyodideInstance = null;
        const defaultPythonCode = `# Online Python compiler (interpreter) to run Python online.\\n# Write Python 3 code in this online editor and run it.\\n\\nprint("Hello world")`;

        // Initialize CodeMirror Editor
        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "python",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4,
            matchBrackets: true,
            autoCloseBrackets: true,
            lineWrapping: true
        });
        editor.setValue(defaultPythonCode);

        // Core Environment Setup (WebAssembly Runtime)
        async function initPyodide() {
            try {
                pyodideInstance = await loadPyodide();
                document.getElementById("status").innerHTML = `
                    <span class="h-1.5 w-1.5 rounded-full bg-green-400"></span>
                    <span class="text-green-400 text-xs">Ready</span>
                `;
                document.getElementById("run-btn").disabled = false;
                document.getElementById("output").textContent = 'Python 3 environment active. Click "Run" to execute code.';
            } catch (err) {
                document.getElementById("output").textContent = "Error setting up environment:\\n" + err;
            }
        }

        // Stream Interception Logic
        async function runCode() {
            if (!pyodideInstance) return;
            
            const outputElement = document.getElementById("output");
            outputElement.textContent = ""; 
            
            let outputBuffer = "";
            pyodideInstance.setStdout({
                batched: (str) => { 
                    outputBuffer += str + "\\n"; 
                    outputElement.textContent = outputBuffer;
                }
            });
            pyodideInstance.setStderr({
                batched: (str) => { 
                    outputBuffer += str + "\\n"; 
                    outputElement.textContent = outputBuffer;
                }
            });

            try {
                const code = editor.getValue();
                await pyodideInstance.runPythonAsync(code);
                if (!outputBuffer) {
                    outputElement.textContent = "Chương trình chạy thành công (Không có dữ liệu in ra).";
                }
            } catch (err) {
                outputElement.textContent = err.message;
            }
        }

        // DOM Event Binding
        document.getElementById("run-btn").onclick = runCode;
        document.getElementById("clear-btn").onclick = () => {
            editor.setValue("");
            editor.focus();
        };

        // Bootstrap App Execution
        window.addEventListener("DOMContentLoaded", () => {
            initPyodide();
        });
    </script>
</body>
</html>
