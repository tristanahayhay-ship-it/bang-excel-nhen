body, html {
    margin: 0;
    padding: 0;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

#game-container {
    border: 4px solid #ff0000;
    box-shadow: 0 0 20px #ff0000;
}

canvas {
    background-color: #000;
    display: block;
}
